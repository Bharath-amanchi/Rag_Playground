[project]
name = "simple-rag-app"
version = "0.1.0"
description = "Simple RAG application"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-chroma",
    "langchain-huggingface",
    "langchain-nvidia-ai-endpoints",
    "chromadb",
    "sentence-transformers",
    "transformers",
    "pypdf",
    "ipykernel",
    "motor>=3.7.1",
    "pymongo>=4.17.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "bcrypt==4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
